<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
  <title id="title">PCIe Flit Mode DLP poison marker mechanism</title>
  <desc id="desc">A 256-byte Flit whose DLP Flit Status marks the last non-NOP TLP in the Flit as poisoned.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#c84b31"/>
    </marker>
    <pattern id="poisonPattern" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#f8d8cf"/>
      <rect width="5" height="14" fill="#efb19f"/>
    </pattern>
  </defs>
  <style>
    .title { font: 700 31px Georgia, serif; fill: #17324d; }
    .subtitle { font: 15px Verdana, sans-serif; fill: #516679; }
    .label { font: 700 17px Verdana, sans-serif; fill: #17324d; }
    .small { font: 14px Verdana, sans-serif; fill: #41566b; }
    .tiny { font: 12px Verdana, sans-serif; fill: #41566b; }
    .box { stroke: #17324d; stroke-width: 2; }
    .brace { stroke: #14816f; stroke-width: 4; fill: none; }
  </style>

  <rect width="1280" height="540" rx="20" fill="#f8f5ed"/>
  <text x="55" y="57" class="title">FM · DLP late-poison marker</text>
  <text x="55" y="86" class="subtitle">The Flit Marker carries poison semantics without rewriting the completed TLP header.</text>

  <rect x="760" y="34" width="465" height="72" rx="12" fill="#fff8ef" stroke="#c84b31" stroke-width="2"/>
  <text x="992.5" y="61" text-anchor="middle" class="label" fill="#9d3828">Error discovered after header formation</text>
  <text x="992.5" y="87" text-anchor="middle" class="small">Physical Logical Layer sets Flit_Status</text>

  <path class="brace" d="M55 153 v-17 h1030 v17 M55 136 v17 M1085 136 v17"/>
  <text x="570" y="127" text-anchor="middle" class="small" fill="#14816f">64-bit FLIT CRC protects all 236 B TLP + 6 B DLP bytes</text>

  <g transform="translate(55 175)">
    <rect class="box" width="840" height="145" rx="8" fill="#eaf4f1"/>
    <text x="18" y="26" class="tiny">TLP area · 236 B</text>

    <rect x="18" y="41" width="190" height="82" rx="7" fill="#cdece5" stroke="#17324d" stroke-width="1.5"/>
    <text x="113" y="77" text-anchor="middle" class="label">TLP 0</text>
    <text x="113" y="101" text-anchor="middle" class="tiny">normal</text>

    <rect x="208" y="41" width="190" height="82" rx="7" fill="#cdece5" stroke="#17324d" stroke-width="1.5"/>
    <text x="303" y="77" text-anchor="middle" class="label">TLP 1</text>
    <text x="303" y="101" text-anchor="middle" class="tiny">normal</text>

    <rect x="398" y="41" width="282" height="82" rx="7" fill="url(#poisonPattern)" stroke="#8f2e20" stroke-width="2.5"/>
    <text x="539" y="75" text-anchor="middle" class="label" fill="#8f2e20">Last TLP</text>
    <text x="539" y="101" text-anchor="middle" class="small" fill="#8f2e20">Poisoned payload</text>

    <rect x="680" y="41" width="142" height="82" rx="7" fill="#e9edf0" stroke="#17324d" stroke-width="1.5"/>
    <text x="751" y="77" text-anchor="middle" class="label">NOP</text>
    <text x="751" y="101" text-anchor="middle" class="tiny">padding</text>

    <rect class="box" x="840" width="190" height="145" rx="8" fill="#f6c66e"/>
    <text x="935" y="27" text-anchor="middle" class="tiny">DLP area · 6 B</text>
    <rect x="858" y="42" width="154" height="80" rx="9" fill="#c84b31" stroke="#8f2e20" stroke-width="2"/>
    <text x="935" y="70" text-anchor="middle" font-family="Verdana, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Flit_Marker</text>
    <text x="935" y="94" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12" fill="#ffffff">Flit_Status:</text>
    <text x="935" y="113" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Last TLP Poisoned</text>

    <rect class="box" x="1030" width="95" height="145" rx="8" fill="#b9ddd8"/>
    <text x="1077.5" y="65" text-anchor="middle" class="label">CRC</text>
    <text x="1077.5" y="90" text-anchor="middle" class="tiny">8 B</text>

    <rect class="box" x="1125" width="70" height="145" rx="8" fill="#dbe7ef"/>
    <text x="1160" y="65" text-anchor="middle" class="label">FEC</text>
    <text x="1160" y="90" text-anchor="middle" class="tiny">6 B</text>
  </g>

  <path d="M990 106 C970 130 940 135 935 165" fill="none" stroke="#c84b31" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M990 330 C925 370 720 365 605 306" fill="none" stroke="#c84b31" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="820" y="378" text-anchor="middle" class="small" fill="#9d3828">Marker points to the last non-NOP TLP, not the entire FLIT</text>

  <rect x="55" y="414" width="1170" height="82" rx="14" fill="#eef4f2" stroke="#9fbcb6" stroke-width="1.5"/>
  <circle cx="86" cy="444" r="9" fill="#c84b31"/>
  <text x="108" y="450" class="small">Earlier TLP 0 and TLP 1 remain normal; only the last TLP receives poison semantics.</text>
  <circle cx="86" cy="476" r="9" fill="#14816f"/>
  <text x="108" y="482" class="small">The DLP marker is outside TLP ECRC coverage but is protected hop-by-hop by the FLIT CRC.</text>
</svg>
