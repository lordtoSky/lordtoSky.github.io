<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">PCIe Flit Mode TLP structure and ECRC coverage</title>
  <desc id="desc">A Flit Mode TLP containing a base header, optional orthogonal header content, optional data payload, an optional four-byte ECRC, and an optional trailer excluded from ECRC calculation.</desc>
  <style>
    .title { font: 700 30px Georgia, serif; fill: #17324d; }
    .label { font: 700 18px Verdana, sans-serif; fill: #17324d; }
    .sub { font: 14px Verdana, sans-serif; fill: #41566b; }
    .note { font: 15px Verdana, sans-serif; fill: #41566b; }
    .box { stroke: #17324d; stroke-width: 2; }
    .covered { fill: #cdece5; }
    .excluded { fill: #e9edf0; }
    .digest { fill: #f6c66e; }
    .brace { stroke: #14816f; stroke-width: 4; fill: none; }
  </style>
  <rect width="1200" height="340" rx="18" fill="#f8f5ed"/>
  <text x="55" y="55" class="title">Flit Mode TLP</text>

  <path class="brace" d="M55 104 v-16 h880 v16 M55 88 v16 M935 88 v16"/>
  <text x="495" y="80" text-anchor="middle" class="label" fill="#14816f">ECRC calculation coverage</text>

  <g transform="translate(55 120)">
    <rect class="box covered" width="225" height="105" rx="8"/>
    <text x="112.5" y="43" text-anchor="middle" class="label">Base Header</text>
    <text x="112.5" y="70" text-anchor="middle" class="sub">3 DW</text>

    <rect class="box covered" x="225" width="235" height="105" rx="8"/>
    <text x="342.5" y="43" text-anchor="middle" class="label">OHC</text>
    <text x="342.5" y="70" text-anchor="middle" class="sub">optional extensions</text>

    <rect class="box covered" x="460" width="330" height="105" rx="8"/>
    <text x="625" y="43" text-anchor="middle" class="label">Data Payload</text>
    <text x="625" y="70" text-anchor="middle" class="sub">optional, variable length</text>

    <rect class="box digest" x="790" width="145" height="105" rx="8"/>
    <text x="862.5" y="43" text-anchor="middle" class="label">ECRC</text>
    <text x="862.5" y="70" text-anchor="middle" class="sub">4 B</text>

    <rect class="box excluded" x="935" width="155" height="105" rx="8"/>
    <text x="1012.5" y="43" text-anchor="middle" class="label">Trailer</text>
    <text x="1012.5" y="70" text-anchor="middle" class="sub">optional</text>
  </g>

  <rect x="55" y="265" width="18" height="18" rx="3" class="covered box"/>
  <text x="84" y="280" class="note">Covered by ECRC</text>
  <rect x="265" y="265" width="18" height="18" rx="3" class="excluded box"/>
  <text x="294" y="280" class="note">Trailer is excluded</text>
  <text x="55" y="316" class="note">The TLP is packed into the 236 B TLP area of one or more 256 B Flits.</text>
</svg>
